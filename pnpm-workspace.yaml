packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  lefthook: true
  unrs-resolver: true
  workerd: true
  core-js: set this to true or false
  es5-ext: set this to true or false
# typescript 7 (catalog) is the native Go compiler with NO JS API — every
# app/package typechecks on it (~10x faster). Peer-resolved API consumers use
# the last JS release instead, pinned as a direct devDependency where they
# run: 6.0.3 at the ROOT (typescript-eslint) and in finance-genui (tsup dts).
# pnpm overrides can't retarget peer linking, hence direct pins. (Regular
# dependencies CAN be overridden — dts-bundle-generator's `typescript:
# >=5.0.2` would otherwise resolve to the API-less 7.)
overrides:
  "dts-bundle-generator>typescript": 6.0.3
catalog:
  dotenv: ^17.2.2
  zod: ^4.1.13
  typescript: 7.0.2
  "@types/node": ^22.13.14
  hono: ^4.8.2
  "@orpc/server": ^1.13.14
  "@orpc/openapi": ^1.13.14
  "@orpc/zod": ^1.13.14
  evlog: ^2.18.1
  next-themes: ^0.4.6
  react: ^19.2.6
  react-dom: ^19.2.6
  "@orpc/client": ^1.13.14
  "@types/react": ^19.2.15
  "@types/react-dom": ^19.2.3
  ioredis: ^5.11.1
  canvas-confetti: 1.9.3
  "@types/canvas-confetti": 1.9.0
  twitter-openapi-typescript: 0.0.55
  twitter-openapi-typescript-generated: 0.0.38
minimumReleaseAgeExclude:
  - shadcn@4.12.0
ignoredBuiltDependencies:
  - core-js
  - es5-ext
verifyDepsBeforeRun: false
