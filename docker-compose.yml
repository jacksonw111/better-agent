name: better-agent

services:
  postgres:
    # pgvector-enabled Postgres (for the memory system's `vector` columns).
    # Same PG major (18) as the image's base, so the extension is available via
    # `CREATE EXTENSION vector`.
    image: pgvector/pgvector:pg18
    container_name: better-agent-postgres
    environment:
      POSTGRES_DB: better-agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - better-agent_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  better-agent_postgres_data:
