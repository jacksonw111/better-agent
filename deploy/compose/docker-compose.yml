# better-agent on a single server via docker-compose.
# Runs: postgres, redis, the API server, web, admin, the three MCP servers
# (mcp / finance-mcp / weread-mcp), and a Caddy reverse proxy (auto-HTTPS).
# The MCP servers ALSO still deploy to Cloudflare Workers (deploy-test.yml) —
# both deployments run the same Hono app; this compose serves the Node build.
# Only authz stays exclusively on Cloudflare Workers — the server reaches it
# over its public URL (AUTHZ_URL). Users point their mcp_servers rows at either
# the Workers URL or the new Caddy MCP domains below.
#
# Images are NOT built here — the server is memory-constrained and would OOM.
# GitHub Actions (.github/workflows/build-images.yml) builds server/web/admin
# and pushes them to ghcr.io; this file only PULLS those prebuilt images.
#
# Usage:
#   cp .env.example .env               # then fill it in (incl. IMAGE_OWNER)
#   docker login ghcr.io               # one-time, to pull the private images
#   docker compose pull                # fetch the latest images
#   docker compose up -d               # start (no --build)

name: better-agent

services:
  postgres:
    # pgvector-enabled Postgres (for the memory system's `vector` columns),
    # PG 18. PG18+ images use a pg_ctlcluster layout: data lives in a versioned
    # subdir (/var/lib/postgresql/18/docker), so the volume mounts at the
    # PARENT /var/lib/postgresql (not /data). Don't set PGDATA — let PG18 use
    # its versioned default. Fresh volume (no PG16 data to migrate).
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: better_agent
      POSTGRES_USER: better_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U better_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies pending drizzle migrations, then seeds the built-in
  # skills (idempotent, by name), then exits. The server waits for it to
  # complete successfully. Reuses the server image; seed-skills runs via tsx on
  # the image's source tree (COPY . .) so it can read builtin-skills/*.md.
  migrate:
    image: ghcr.io/jacksonw111/better-agent-server:${IMAGE_TAG:-latest}
    # Seed is non-fatal: if it errors, migrate still exits 0 so the server (which
    # depends on this one-shot) always starts. dist/seed-skills.mjs reads the
    # built-in .md files from BUILTIN_SKILLS_DIR (baked into the image).
    command:
      [
        "sh",
        "-c",
        "node dist/migrate.mjs && (node dist/seed-skills.mjs || echo 'seed-skills failed, continuing')",
      ]
    environment:
      DATABASE_URL: postgres://better_agent:${POSTGRES_PASSWORD}@postgres:5432/better_agent
      # migrate + seed only need DATABASE_URL; skip the full app env schema
      # (which requires AUTH_JWT_SECRET, CORS_ORIGIN, … this one-shot doesn't use).
      SKIP_ENV_VALIDATION: "1"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    image: ghcr.io/jacksonw111/better-agent-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://better_agent:${POSTGRES_PASSWORD}@postgres:5432/better_agent
      REDIS_URL: redis://redis:6379
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?}
      CREDENTIALS_SECRET: ${CREDENTIALS_SECRET:?}
      CORS_ORIGIN: ${CORS_ORIGIN:?}
      WEB_URL: ${WEB_URL:?}
      ADMIN_URL: ${ADMIN_URL:?}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-noreply@example.com}
      # Attachments via R2's S3 API (stays on Cloudflare).
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # Invite gate — authz stays on Workers, reached over its public URL.
      AUTHZ_URL: ${AUTHZ_URL:-}
      AUTHZ_SERVICE_SECRET: ${AUTHZ_SERVICE_SECRET:-}
      # Optional OAuth.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Memory embeddings (SiliconFlow). Without the key, memory add/search and
      # the memory MCP tools return a clear "provider unavailable" error.
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      # Web Push (P3-T3). Without the key pair the push feature is disabled
      # fail-open (subscribe route errors clearly, ingest hook no-ops).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: ghcr.io/jacksonw111/better-agent-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - server

  admin:
    image: ghcr.io/jacksonw111/better-agent-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - server

  # ── MCP servers ───────────────────────────────────────────────────────────
  # Stateless Hono apps (no DB/redis). Each listens on :3000 (PORT); the outer
  # Caddy reverse-proxies its domain to <service>:3000. No host ports exposed.
  # X (Twitter) MCP — per-request bearer token carries the user's X auth_token;
  # no server-side secret needed.
  mcp:
    image: ghcr.io/jacksonw111/better-agent-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000

  # Finance MCP — optional shared-token gate (API_TOKEN) plus upstream API keys.
  # Empty API_TOKEN means open access (matches the Workers behavior).
  finance-mcp:
    image: ghcr.io/jacksonw111/better-agent-finance-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_TOKEN: ${FINANCE_MCP_API_TOKEN:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      ADANOS_API_KEY: ${ADANOS_API_KEY:-}

  # WeRead MCP — the WeRead API key is normally per-user (bearer token on each
  # request); WEREAD_API_KEY is an optional single-user fallback.
  weread-mcp:
    image: ghcr.io/jacksonw111/better-agent-weread-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      WEREAD_API_KEY: ${WEREAD_API_KEY:-}

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
      WEB_DOMAIN: ${WEB_DOMAIN:?}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?}
      MCP_DOMAIN: ${MCP_DOMAIN:?}
      FINANCE_MCP_DOMAIN: ${FINANCE_MCP_DOMAIN:?}
      WEREAD_MCP_DOMAIN: ${WEREAD_MCP_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - server
      - web
      - admin
      - mcp
      - finance-mcp
      - weread-mcp

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
