# better-agent on a single server via docker-compose.
# Runs: postgres, redis, the API server, web, admin, and a Caddy reverse proxy
# (auto-HTTPS). authz and mcp stay on Cloudflare Workers — the server reaches
# them over their public URLs (AUTHZ_URL / the MCP server URL a user configures).
#
# Images are NOT built here — the server is memory-constrained and would OOM.
# GitHub Actions (.github/workflows/build-images.yml) builds server/web/admin
# and pushes them to ghcr.io; this file only PULLS those prebuilt images.
#
# Usage:
#   cp .env.example .env               # then fill it in (incl. IMAGE_OWNER)
#   docker login ghcr.io               # one-time, to pull the private images
#   docker compose pull                # fetch the latest images
#   docker compose up -d               # start (no --build)

name: better-agent

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: better_agent
      POSTGRES_USER: better_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U better_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies pending drizzle migrations, then exits. The server waits
  # for it to complete successfully. Reuses the server image.
  migrate:
    image: ghcr.io/jacksonw111/better-agent-server:${IMAGE_TAG:-latest}
    command: ["node", "dist/migrate.mjs"]
    environment:
      DATABASE_URL: postgres://better_agent:${POSTGRES_PASSWORD}@postgres:5432/better_agent
      # migrate only needs DATABASE_URL; skip the full app env schema (which
      # requires AUTH_JWT_SECRET, CORS_ORIGIN, … that this one-shot doesn't use).
      SKIP_ENV_VALIDATION: "1"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    image: ghcr.io/jacksonw111/better-agent-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://better_agent:${POSTGRES_PASSWORD}@postgres:5432/better_agent
      REDIS_URL: redis://redis:6379
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?}
      CREDENTIALS_SECRET: ${CREDENTIALS_SECRET:?}
      CORS_ORIGIN: ${CORS_ORIGIN:?}
      WEB_URL: ${WEB_URL:?}
      ADMIN_URL: ${ADMIN_URL:?}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-noreply@example.com}
      # Attachments via R2's S3 API (stays on Cloudflare).
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # Invite gate — authz stays on Workers, reached over its public URL.
      AUTHZ_URL: ${AUTHZ_URL:-}
      AUTHZ_SERVICE_SECRET: ${AUTHZ_SERVICE_SECRET:-}
      # Optional OAuth.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: ghcr.io/jacksonw111/better-agent-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - server

  admin:
    image: ghcr.io/jacksonw111/better-agent-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - server

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
      WEB_DOMAIN: ${WEB_DOMAIN:?}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - server
      - web
      - admin

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
