name = "better-agent-finance-mcp"
main = "src/worker.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"

# v1 caching uses the implicit `caches.default` Cache API — no KV binding
# needed. If a future version switches to KV, add a [[kv_namespaces]] block
# here and create the namespace with:
#   wrangler kv namespace create finance_cache

# API_TOKEN is a secret (fixed shared-token auth gate on /mcp, /api/*, /pdf).
# Set it with `wrangler secret put API_TOKEN`. Unset/empty means open access.
