name = "better-agent-weread-mcp"
main = "src/worker.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"

# The WeRead API key (wrk-xxxxxxxx) is per-user (bound to a WeChat identity).
# Callers send it as `Authorization: Bearer wrk-…` on every request — the
# platform's MCP client stores it encrypted as the server's authHeader.
# A worker-level WEREAD_API_KEY secret may optionally be set as a single-user
# fallback; the per-request bearer token always takes precedence.
