name = "better-agent-weread-mcp"
main = "src/worker.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"

# The WeRead API key (wrk-xxxxxxxx) is per-user and passed by callers via the
# x-weread-key header on each request — NOT a worker secret. A worker-level
# WEREAD_API_KEY secret may optionally be set (wrangler secret put WEREAD_API_KEY)
# as a single-user fallback; the per-request header always takes precedence.
# API_TOKEN is an optional shared-token auth gate on /mcp and /api/*.
# Set it with `wrangler secret put API_TOKEN`. Unset/empty means open access.
