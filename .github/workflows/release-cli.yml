name: Release CLI (auto on version bump)

# AUTOMATIC: bump `apps/bridge-cli/package.json` "version" and merge to `dev` →
# this builds the standalone binaries and publishes a GitHub Release tagged
# `cli-v<version>`. Idempotent — if that version's release already exists it
# skips, so editing package.json for other reasons won't re-release. Manual
# re-run via the Actions "Run workflow" button (workflow_dispatch).
#
# `bun build --compile` embeds the Bun runtime, so each binary runs with NO
# Node.js / npm on the user's machine.
#
# Install (users):
#   curl -fsSL https://github.com/jacksonw111/better-agent/releases/latest/download/install.sh | bash
#   agent-cli --agent claude-code --token bt_… --server https://…
#
# The CLI was renamed better-agent-bridge → agent-cli (0.2.0). Both binary
# names are published in each release so existing install.sh/scripts keep
# working; agent-cli is the canonical name going forward.

on:
  push:
    branches: [dev]
    paths:
      - "apps/bridge-cli/package.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Compute the target tag from the current CLI version and decide whether a
  # release is needed (skips if `cli-v<version>` was already published).
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./apps/bridge-cli/package.json').version")
          tag="cli-v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "${tag}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} already released — skipping."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::New version ${version} → releasing ${tag}."
          fi

  release:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2
      - name: Build cross-platform binaries (Bun --compile)
        run: |
          for entry in \
            "bun-darwin-arm64 agent-cli-darwin-arm64" \
            "bun-darwin-x64   agent-cli-darwin-x64" \
            "bun-linux-x64    agent-cli-linux-x64" \
            "bun-linux-arm64  agent-cli-linux-arm64"; do
            set -- $entry
            target="$1"
            out="$2"
            echo "::group::Build ${target} → ${out}"
            bun build --compile --target="${target}" apps/bridge-cli/src/index.ts --outfile "${out}"
            ls -lh "${out}"
            # Also publish under the pre-0.2.0 binary name so existing
            # install.sh copies / docs pointing at better-agent-bridge-<os>-<arch>
            # keep working for one major version.
            cp "${out}" "${out/agent-cli/better-agent-bridge}"
            echo "::endgroup::"
          done
      - name: Create GitHub Release with binaries + installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.gate.outputs.tag }}" \
            agent-cli-darwin-arm64 \
            agent-cli-darwin-x64 \
            agent-cli-linux-x64 \
            agent-cli-linux-arm64 \
            better-agent-bridge-darwin-arm64 \
            better-agent-bridge-darwin-x64 \
            better-agent-bridge-linux-x64 \
            better-agent-bridge-linux-arm64 \
            apps/bridge-cli/install.sh \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${{ needs.gate.outputs.tag }}" \
            --notes "The bridge CLI's canonical binary is now **agent-cli** (renamed from \`better-agent-bridge\`). Both binary names are published in this release, and \`better-agent-bridge\` remains a supported alias for one major version — existing install scripts keep working unchanged." \
            --generate-notes
