name: Release CLI (auto on version bump)

# AUTOMATIC: bump `apps/bridge-cli/package.json` "version" and merge to `dev` →
# this builds the standalone binaries and publishes a GitHub Release tagged
# `cli-v<version>`. Idempotent — if that version's release already exists it
# skips, so editing package.json for other reasons won't re-release. Manual
# re-run via the Actions "Run workflow" button (workflow_dispatch).
#
# `bun build --compile` embeds the Bun runtime, so each binary runs with NO
# Node.js / npm on the user's machine.
#
# Install (users):
#   curl -fsSL https://github.com/jacksonw111/better-agent/releases/latest/download/install.sh | bash
#   agent-cli --agent claude-code --token bt_… --server https://…
#
# The CLI was renamed better-agent-bridge → agent-cli (0.2.0). Both binary
# names are published in each release so existing install.sh/scripts keep
# working; agent-cli is the canonical name going forward.

on:
  push:
    branches: [dev]
    paths:
      - "apps/bridge-cli/package.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Compute the target tag from the current CLI version and decide whether a
  # release is needed (skips if `cli-v<version>` was already published).
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./apps/bridge-cli/package.json').version")
          tag="cli-v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "${tag}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} already released — skipping."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::New version ${version} → releasing ${tag}."
          fi

  # Each OS/arch's native pty-broker (native/pty-broker.c) must be compiled on a
  # runner that can produce that OS's binary, then embedded (base64) into the
  # Bun `--compile` bundle. macOS binaries build on a macOS runner (`cc -arch`);
  # Linux binaries build on Ubuntu (native x64 + `gcc-aarch64-linux-gnu` cross).
  build:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - runner: macos-14
            targets: "darwin-arm64 darwin-x64"
          - runner: ubuntu-latest
            targets: "linux-x64 linux-arm64"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2
      - name: Install aarch64 cross-compiler (Linux runner only)
        if: matrix.runner == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Compile broker, embed, and build binaries (Bun --compile)
        run: |
          mkdir -p apps/bridge-cli/.broker-build
          for target in ${{ matrix.targets }}; do
            echo "::group::Build ${target}"
            # 1. Cross-compile the native pty-broker for this OS/arch.
            apps/bridge-cli/scripts/build-broker.sh "${target}" \
              "apps/bridge-cli/.broker-build/pty-broker-${target}"
            # 2. Embed it (base64) into the source asset.
            node apps/bridge-cli/scripts/embed-broker.mjs "${target}" \
              "apps/bridge-cli/.broker-build/pty-broker-${target}"
            # 3. Compile the standalone CLI carrying that embedded broker.
            bun build --compile --target="bun-${target}" \
              apps/bridge-cli/src/index.ts --outfile "agent-cli-${target}"
            # 4. Restore the placeholder before the next target.
            node apps/bridge-cli/scripts/embed-broker.mjs --restore
            ls -lh "agent-cli-${target}"
            # Also publish under the pre-0.2.0 binary name so existing
            # install.sh copies / docs pointing at better-agent-bridge-<os>-<arch>
            # keep working for one major version.
            cp "agent-cli-${target}" "better-agent-bridge-${target}"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cli-binaries-${{ matrix.runner }}
          path: |
            agent-cli-*
            better-agent-bridge-*
          if-no-files-found: error

  release:
    needs: [gate, build]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-binaries-*
          merge-multiple: true
          path: bins
      - name: Create GitHub Release with binaries + installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.gate.outputs.tag }}" \
            bins/agent-cli-darwin-arm64 \
            bins/agent-cli-darwin-x64 \
            bins/agent-cli-linux-x64 \
            bins/agent-cli-linux-arm64 \
            bins/better-agent-bridge-darwin-arm64 \
            bins/better-agent-bridge-darwin-x64 \
            bins/better-agent-bridge-linux-x64 \
            bins/better-agent-bridge-linux-arm64 \
            apps/bridge-cli/install.sh \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${{ needs.gate.outputs.tag }}" \
            --notes "The bridge CLI's canonical binary is now **agent-cli** (renamed from \`better-agent-bridge\`). Both binary names are published in this release, and \`better-agent-bridge\` remains a supported alias for one major version — existing install scripts keep working unchanged." \
            --generate-notes
