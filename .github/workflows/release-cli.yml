name: Release CLI (standalone binaries)

# Push a tag like `cli-v0.1.0` to build standalone binaries and publish them
# as a GitHub Release. `bun build --compile` embeds the Bun runtime, so each
# binary runs with NO Node.js / npm installed on the user's machine.
#
# Install (users):
#   curl -fsSL https://github.com/jacksonw111/better-agent/releases/latest/download/install.sh | bash
#   better-agent-bridge --agent claude-code --token bt_… --server https://…
on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2
      - name: Build cross-platform binaries (Bun --compile)
        run: |
          for entry in \
            "bun-darwin-arm64 better-agent-bridge-darwin-arm64" \
            "bun-darwin-x64   better-agent-bridge-darwin-x64" \
            "bun-linux-x64    better-agent-bridge-linux-x64" \
            "bun-linux-arm64  better-agent-bridge-linux-arm64"; do
            set -- $entry
            target="$1"
            out="$2"
            echo "::group::Build ${target} → ${out}"
            bun build --compile --target="${target}" apps/bridge-cli/src/index.ts --outfile "${out}"
            ls -lh "${out}"
            echo "::endgroup::"
          done
      - name: Create GitHub Release with binaries + installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "${tag}" \
            better-agent-bridge-darwin-arm64 \
            better-agent-bridge-darwin-x64 \
            better-agent-bridge-linux-x64 \
            better-agent-bridge-linux-arm64 \
            apps/bridge-cli/install.sh \
            --title "${tag}" \
            --generate-notes
