name: Deploy test (Workers)

# Pushing to `dev` deploys authz + mcp to Cloudflare Workers. server / web /
# admin now run on the self-hosted Docker server — their images are built by
# build-images.yml and pulled from ghcr (see deploy/compose). No local deploys.
on:
  push:
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test mcp
        run: pnpm -F mcp test
      - name: Deploy mcp
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/mcp
          command: deploy

  finance-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test finance-mcp
        run: pnpm -F finance-mcp test
      - name: Deploy finance-mcp
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/finance-mcp
          command: deploy
          secrets: |
            FRED_API_KEY
            API_TOKEN
            ADANOS_API_KEY
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ADANOS_API_KEY: ${{ secrets.ADANOS_API_KEY }}

  weread-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test weread-mcp
        run: pnpm -F weread-mcp test
      - name: Deploy weread-mcp
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/weread-mcp
          command: deploy
          secrets: |
            WEREAD_API_KEY
            API_TOKEN
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
          API_TOKEN: ${{ secrets.API_TOKEN }}

  authz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate authz database
        run: pnpm -F authz exec drizzle-kit migrate
        env:
          AUTHZ_DATABASE_URL: ${{ secrets.AUTHZ_DATABASE_URL }}
      - name: Seed authz admin
        run: pnpm -F authz exec tsx src/seed-admin.ts
        env:
          AUTHZ_DATABASE_URL: ${{ secrets.AUTHZ_DATABASE_URL }}
          AUTHZ_ADMIN_EMAIL: ${{ secrets.AUTHZ_ADMIN_EMAIL }}
          AUTHZ_ADMIN_PASSWORD: ${{ secrets.AUTHZ_ADMIN_PASSWORD }}
      - name: Build authz SPA
        run: pnpm -F authz build
      - name: Deploy authz
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/authz
          command: deploy
          secrets: |
            AUTHZ_DATABASE_URL
            AUTHZ_JWT_SECRET
            AUTHZ_SERVICE_SECRET
            MAIN_SERVER_URL
        env:
          AUTHZ_DATABASE_URL: ${{ secrets.AUTHZ_DATABASE_URL }}
          AUTHZ_JWT_SECRET: ${{ secrets.AUTHZ_JWT_SECRET }}
          AUTHZ_SERVICE_SECRET: ${{ secrets.AUTHZ_SERVICE_SECRET }}
          MAIN_SERVER_URL: ${{ secrets.MAIN_SERVER_URL }}
