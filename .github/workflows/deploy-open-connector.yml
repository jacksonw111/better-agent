name: Deploy open-connector (Workers)

# Deploys oomol-lab/open-connector to Cloudflare Workers (D1 + R2 + Static
# Assets). open-connector is an external repo with its own npm/oxlint toolchain,
# so we do NOT vendor it into this pnpm monorepo — this job checks it out at a
# pinned SHA and runs its own `deploy:cloudflare` script. Fully self-bootstrapping:
# it creates the D1 database and R2 bucket on first run (idempotent afterwards) and
# resolves the D1 id at runtime, so no manual `wrangler login` is ever needed —
# it authenticates entirely via CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID.
# Manual trigger only.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-open-connector
  cancel-in-progress: true

# Pinned open-connector commit. Bump deliberately after reviewing upstream.
env:
  OPEN_CONNECTOR_REF: d375308e28742cadef40b09b2a202aafb7778d46

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout open-connector
        uses: actions/checkout@v4
        with:
          repository: oomol-lab/open-connector
          ref: ${{ env.OPEN_CONNECTOR_REF }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure D1 database + R2 bucket
        id: bootstrap
        run: |
          set -e
          # D1: create if missing (idempotent), then resolve its uuid.
          npx wrangler d1 create open-connector || echo "D1 already exists, continuing"
          DB_ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const a=JSON.parse(s);const m=a.find((x)=>x.name==='open-connector');if(!m){console.error('open-connector D1 not found after create');process.exit(1);}process.stdout.write(m.uuid||m.database_id||'');});")
          if [ -z "$DB_ID" ]; then echo "failed to resolve D1 database_id"; exit 1; fi
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved D1 database_id."
          # R2: create if missing (idempotent).
          npx wrangler r2 bucket create open-connector-transit-files || echo "R2 bucket already exists, continuing"

      - name: Materialize wrangler config
        run: |
          cp wrangler.example.jsonc wrangler.local.jsonc
          node -e "const fs=require('fs');const f='wrangler.local.jsonc';let s=fs.readFileSync(f,'utf8');s=s.replace('<your-d1-database-id>',process.env.DB_ID);fs.writeFileSync(f,s);"
        env:
          DB_ID: ${{ steps.bootstrap.outputs.db_id }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply open-connector --remote --config wrangler.local.jsonc

      - name: Deploy
        run: npm run deploy:cloudflare

      - name: Set Worker secrets
        # After the first deploy the Worker exists, so `secret put` succeeds.
        # Secrets propagate to the live Worker immediately (no redeploy needed).
        run: |
          printf '%s' "$OC_ADMIN_TOKEN"    | npx wrangler secret put OOMOL_CONNECT_ADMIN_TOKEN    --config wrangler.local.jsonc
          printf '%s' "$OC_RUNTIME_TOKEN"  | npx wrangler secret put OOMOL_CONNECT_RUNTIME_TOKEN  --config wrangler.local.jsonc
          printf '%s' "$OC_ENCRYPTION_KEY" | npx wrangler secret put OOMOL_CONNECT_ENCRYPTION_KEY --config wrangler.local.jsonc
        env:
          OC_ADMIN_TOKEN: ${{ secrets.OC_ADMIN_TOKEN }}
          OC_RUNTIME_TOKEN: ${{ secrets.OC_RUNTIME_TOKEN }}
          OC_ENCRYPTION_KEY: ${{ secrets.OC_ENCRYPTION_KEY }}
