name: Deploy server (SSH)

# Auto-deploys the Docker stack to the self-hosted server after images are built.
#
# Flow: push to `dev` → "Build images (ghcr)" builds + pushes server/web/admin
# images → THIS workflow SSHes to the server, refreshes the compose file, and
# runs `docker compose pull && up -d` (which also runs the one-shot `migrate`).
#
# ── One-time GitHub setup (Settings → Secrets and variables → Actions) ──
#   Secret  (required):  SERVER_PASSWD      the server's SSH password
#   Variable(required):  SERVER_HOST          server IP or hostname
#   Variable(required):  SERVER_DEPLOY_DIR    abs path to the dir holding
#                                             docker-compose.yml + .env on the
#                                             server, e.g. /root/better-agent/deploy/compose
#   Variable(optional):  SERVER_USER          SSH user      (default: root)
#   Variable(optional):  SERVER_PORT          SSH port      (default: 22)
#
# ── Optional MCP config (synced into the server .env, like VAPID) ──
#   Variables (non-secret, the public domains — need A records → server IP):
#     MCP_DOMAIN, FINANCE_MCP_DOMAIN, WEREAD_MCP_DOMAIN
#     (unset → compose serves that MCP on *.localhost, internal-only)
#   Secrets (upstream API keys, optional per MCP):
#     FINANCE_MCP_API_TOKEN, FRED_API_KEY, ADANOS_API_KEY, WEREAD_API_KEY
#   Each is upserted only when set; unset ones leave the .env line untouched.
#
# Assumptions: Docker + compose plugin installed on the server, and it's already
# logged in to ghcr.io (`docker login ghcr.io` once) so it can pull the private
# images. `.env` on the server is NEVER touched by this workflow EXCEPT the
# idempotent VAPID + MCP-config upserts above.

on:
  workflow_run:
    workflows: ["Build images (ghcr)"]
    types: [completed]
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  deploy:
    # On the automatic trigger, only deploy if the image build actually succeeded.
    # Manual runs (workflow_dispatch) always proceed.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      # The `secrets` context isn't usable in step-level `if` — mapped here so
      # the VAPID sync step can gate on it.
      HAS_VAPID: ${{ secrets.VAPID_PUBLIC_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify required config
        env:
          SERVER_PASSWD: ${{ secrets.SERVER_PASSWD }}
          SERVER_HOST: ${{ vars.SERVER_HOST || secrets.SERVER_HOST }}
          SERVER_DEPLOY_DIR: ${{ vars.SERVER_DEPLOY_DIR || secrets.SERVER_DEPLOY_DIR }}
        run: |
          missing=""
          [ -n "$SERVER_PASSWD" ]   || missing="$missing SERVER_PASSWD(secret)"
          [ -n "$SERVER_HOST" ]       || missing="$missing SERVER_HOST(variable-or-secret)"
          [ -n "$SERVER_DEPLOY_DIR" ] || missing="$missing SERVER_DEPLOY_DIR(variable-or-secret)"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub config:$missing — see the header of this workflow file."
            exit 1
          fi

      # Ship the latest compose file + Caddyfile so compose changes deploy too.
      # strip_components:2 drops the leading `deploy/compose/` so the files land
      # directly in SERVER_DEPLOY_DIR. .env is never sent.
      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_HOST || secrets.SERVER_HOST }}
          username: ${{ vars.SERVER_USER || secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWD }}
          port: ${{ vars.SERVER_PORT || secrets.SERVER_PORT || '22' }}
          source: "deploy/compose/docker-compose.yml,deploy/compose/Caddyfile"
          target: ${{ vars.SERVER_DEPLOY_DIR || secrets.SERVER_DEPLOY_DIR }}
          strip_components: 2

      # Exception to ".env is never touched": VAPID keys are the one pair the
      # workflow syncs INTO the server's .env (idempotent upsert, only when the
      # GitHub secrets are set) — they were generated by CI concerns, not by a
      # human on the box, and rotating them should not require SSHing in.
      - name: Sync VAPID keys into .env
        if: ${{ env.HAS_VAPID == 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        with:
          host: ${{ vars.SERVER_HOST || secrets.SERVER_HOST }}
          username: ${{ vars.SERVER_USER || secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWD }}
          port: ${{ vars.SERVER_PORT || secrets.SERVER_PORT || '22' }}
          envs: VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY
          script_stop: true
          script: |
            set -eu
            cd "${{ vars.SERVER_DEPLOY_DIR || secrets.SERVER_DEPLOY_DIR }}"
            touch .env
            for pair in "VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY" "VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY"; do
              key="${pair%%=*}"
              grep -q "^${key}=" .env && sed -i "s|^${key}=.*|${pair}|" .env || echo "$pair" >> .env
            done
            echo "VAPID keys synced"

      # Same ".env is never touched" exception as VAPID: sync the MCP compose
      # config (domains + upstream API keys) so adding/rotating an MCP never
      # requires SSHing to the box. Domains are non-secret → GitHub Variables;
      # API keys → Secrets. Each value is upserted only when set, so an unset
      # one leaves any existing .env line intact (and an unset domain lets
      # compose fall back to its `.localhost` default). Delete-then-append
      # (not sed) so arbitrary token characters can't break the substitution.
      # Runs unconditionally — every upsert self-skips on an empty value.
      - name: Sync MCP config into .env
        uses: appleboy/ssh-action@v1.2.0
        env:
          MCP_DOMAIN: ${{ vars.MCP_DOMAIN }}
          FINANCE_MCP_DOMAIN: ${{ vars.FINANCE_MCP_DOMAIN }}
          WEREAD_MCP_DOMAIN: ${{ vars.WEREAD_MCP_DOMAIN }}
          FINANCE_MCP_API_TOKEN: ${{ secrets.FINANCE_MCP_API_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ADANOS_API_KEY: ${{ secrets.ADANOS_API_KEY }}
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        with:
          host: ${{ vars.SERVER_HOST || secrets.SERVER_HOST }}
          username: ${{ vars.SERVER_USER || secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWD }}
          port: ${{ vars.SERVER_PORT || secrets.SERVER_PORT || '22' }}
          envs: MCP_DOMAIN,FINANCE_MCP_DOMAIN,WEREAD_MCP_DOMAIN,FINANCE_MCP_API_TOKEN,FRED_API_KEY,ADANOS_API_KEY,WEREAD_API_KEY
          script_stop: true
          script: |
            set -eu
            cd "${{ vars.SERVER_DEPLOY_DIR || secrets.SERVER_DEPLOY_DIR }}"
            touch .env
            upsert() {
              key="$1"
              val="$2"
              [ -n "$val" ] || return 0
              grep -v "^${key}=" .env > .env.tmp 2>/dev/null || true
              printf '%s=%s\n' "$key" "$val" >> .env.tmp
              mv .env.tmp .env
            }
            upsert MCP_DOMAIN "$MCP_DOMAIN"
            upsert FINANCE_MCP_DOMAIN "$FINANCE_MCP_DOMAIN"
            upsert WEREAD_MCP_DOMAIN "$WEREAD_MCP_DOMAIN"
            upsert FINANCE_MCP_API_TOKEN "$FINANCE_MCP_API_TOKEN"
            upsert FRED_API_KEY "$FRED_API_KEY"
            upsert ADANOS_API_KEY "$ADANOS_API_KEY"
            upsert WEREAD_API_KEY "$WEREAD_API_KEY"
            echo "MCP config synced"

      - name: Pull images and restart the stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SERVER_HOST || secrets.SERVER_HOST }}
          username: ${{ vars.SERVER_USER || secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWD }}
          port: ${{ vars.SERVER_PORT || secrets.SERVER_PORT || '22' }}
          # Fail the job if any command fails, so a broken deploy is visible.
          script_stop: true
          script: |
            set -eu
            cd "${{ vars.SERVER_DEPLOY_DIR || secrets.SERVER_DEPLOY_DIR }}"
            echo "── deploying in $(pwd) ──"
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps
