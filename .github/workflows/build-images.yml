name: Build images (ghcr)

# Builds the Docker images for the services that run on the self-hosted server
# (server + web + admin + the three MCP servers) and pushes them to GitHub
# Container Registry. The server is memory-constrained, so it never builds
# locally — it only `docker compose pull`s these prebuilt images. The MCP images
# built here run the Node build of the same apps that ALSO deploy to Cloudflare
# Workers (deploy-test.yml). Only authz stays exclusively on Workers, not here.
on:
  push:
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: build-images
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Full-monorepo typecheck gate (the per-image builds only compile their own
  # app), so a broken type never gets baked into a published image.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check-types

  images:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: server
            dockerfile: deploy/docker/server.Dockerfile
          - app: web
            dockerfile: deploy/docker/app.Dockerfile
          - app: admin
            dockerfile: deploy/docker/app.Dockerfile
          - app: mcp
            dockerfile: deploy/docker/mcp.Dockerfile
          - app: finance-mcp
            dockerfile: deploy/docker/mcp.Dockerfile
          - app: weread-mcp
            dockerfile: deploy/docker/mcp.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            APP=${{ matrix.app }}
            VITE_SERVER_URL=${{ vars.PUBLIC_API_URL || 'https://agent-api.trendf.top' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/better-agent-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/better-agent-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
